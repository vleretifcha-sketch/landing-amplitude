<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amplitude — Réinitialisation</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    (function () {
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      var target = 'amplitude://reset-password' + query + hash;
      window.location.replace(target);
      setTimeout(function () {
        document.getElementById('fallback').style.display = 'block';
      }, 1500);
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center;">
  <p>Ouverture de l'app Amplitude…</p>
  <p id="fallback" style="display: none;">
    Si l'app ne s'ouvre pas, installez Amplitude puis réessayez le lien depuis votre email.
  </p>
</body>
</html>
